<script>
    document.addEventListener("dragend", function (event) {
        let X = event.clientX > 50 ? event.clientX - 50 : 3;
        let Y = event.clientY > 50 ? event.clientY - 50 : 3;
        X = X > window.innerWidth - 50 ? window.innerWidth - 50 : X;
        Y = Y > window.innerHeight - 50 ? window.innerHeight - 50 : Y;
        document.getElementById("goAmpl").style = "margin-left:" + (X) + 'px;' + "margin-top:" + (Y) + 'px';
    });
    document.getElementById('goAmpl').addEventListener("touchmove", function (event) {
        let X = event.changedTouches[0].clientX > 50 ? event.changedTouches[0].clientX - 11 : 3;
        let Y = event.changedTouches[0].clientY > 50 ? event.changedTouches[0].clientY - 11 : 3;
        X = X > window.innerWidth - 50 ? window.innerWidth - 50 : X;
        Y = Y > window.innerHeight - 50 ? window.innerHeight - 50 : Y;
        document.getElementById("goAmpl").style = "margin-left:" + (X) + 'px;' + "margin-top:" + (Y) + 'px';
    });
    let isNative = false;
    window.addEventListener('message', function (e) {
        let data = e.data
        if (data === 'gameCpLd1m7OxZG0RX524yMUJe6sk') {
            onClick()
        } else {
            addMessage(data)
        }
    });

    function addMessage(data) {
        if (!isNative) {
            isNative = data.isNative;
        }
        if (data.url !== undefined) {
            let url = base64Decode(data.url)
            document.getElementById('iframe-one').src = url
            document.getElementById('iframe-one').name = url
        }
    }

    function base64Decode(input) {
        let _keyStr = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=";
        let output = "";
        let chr1, chr2, chr3;
        let enc1, enc2, enc3, enc4;
        let i = 0;
        input = input.replace(/[^A-Za-z0-9\+\/\=]/g, "");
        while (i < input.length) {
            enc1 = _keyStr.indexOf(input.charAt(i++));
            enc2 = _keyStr.indexOf(input.charAt(i++));
            enc3 = _keyStr.indexOf(input.charAt(i++));
            enc4 = _keyStr.indexOf(input.charAt(i++));
            chr1 = (enc1 << 2) | (enc2 >> 4);
            chr2 = ((enc2 & 15) << 4) | (enc3 >> 2);
            chr3 = ((enc3 & 3) << 6) | enc4;
            output = output + String.fromCharCode(chr1);
            if (enc3 !== 64) {
                output = output + String.fromCharCode(chr2);
            }
            if (enc4 !== 64) {
                output = output + String.fromCharCode(chr3);
            }
        }
        return output;
    }

    window.addEventListener('resize', function (e) {
        if (e.target.orientation === 0) {
            document.getElementById('bgDiv').style.backgroundSize = '50% 20%'
        } else {
            document.getElementById('bgDiv').style.backgroundSize = '50% 20%'
        }
    });

    function onClick() {
        if (isNative) {
            document.location = 'webviewMessage://close'
        } else {
            parent.postMessage("close", "*")
        }
    }
